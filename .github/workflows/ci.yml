name: LAND site build check

on:
  push:
    branches:
      - fix/build-defects
      - main
    paths-ignore:
      - '**/package-lock.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Install, typecheck and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Report resolved versions
        run: |
          npm ls next react react-dom styled-components @tanstack/react-query wagmi viem || true
          node -p "'next resolved: ' + require('next/package.json').version"

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Commit resolved lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --staged --quiet; then
            echo "package-lock.json unchanged"
          else
            git commit -m "chore: add package-lock.json resolved by CI"
            git push origin HEAD:${{ github.ref_name }}
          fi
