name: LAND site build check

# BRANCH-LOCAL ONLY: this file exists on copy/deploy-pages-surgical so that a push
# to this branch runs the build proof. Only src/components/home-page.tsx and
# src/components/about-page.tsx are meant to travel to deploy/pages. Never merge
# this workflow change into deploy/pages.

on:
  push:
    branches:
      - fix/build-defects
      - main
      - copy/deploy-pages-surgical
    paths-ignore:
      - '**/package-lock.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Install, typecheck and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Report resolved versions
        run: |
          npm ls next react react-dom styled-components @tanstack/react-query wagmi viem || true
          node -p "'next resolved: ' + require('next/package.json').version"

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
